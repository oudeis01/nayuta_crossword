# namedrop_crossword 설정
# 모든 파라미터는 여기서 조정 (실측 후 그리드/임계값 튜닝 가능하도록 중앙화)

paths:
  corpus_root: /home/choiharam/works/projects/namedrop_data/analysis_pipeline/corpus_preparation/filtered_corpus
  keywords_json: /home/choiharam/works/projects/namedrop_data/analysis_pipeline/discourse_keywords_v3.json
  data_dir: data            # 중간 산출물 저장 위치 (프로젝트 루트 기준)

corpus:
  # filtered_corpus 하위에서 사용할 13개 디렉토리 (control, timothy* 제외)
  include_dirs:
    - afterall
    - ars_electronica
    - artforum
    - creative_app_net
    - e-flux
    - moussemagazine
    - neuralit
    - spikeart
    - stedelijk
    - tate
    - transmediale
    - v2lab
    - zkm
  # 어휘 채굴에 포함할 블록의 segment_type (나머지는 제외)
  include_segment_types:
    - CURATORIAL

vocab:
  min_len: 3                 # rule.md 절대규칙 2: 최소 3글자
  max_len: 17                # 17x17 그리드 한 변 = 최대 단어 길이
  # 후보 채택 빈도 임계값 (사전 검증 없이 빈도만 사용 — 사용자 결정)
  # 분석 단계에서 여러 임계값을 비교 출력하고, 최종값은 데이터 보고 확정
  candidate_min_count: 5

keywords:
  # 복합어(공백/하이픈)는 결합해 단일 토큰화 (climate change -> climatechange)
  concatenate: true
  # 코어 복합어가 결합 후 그리드보다 길면 구성 단어로 분절 (사용자 결정)
  split_oversize_core: true
  # 코어 키워드는 코퍼스 미등장이어도 강제 포함 (사용자 결정)
  force_include_core: true
  # 분절 시 답안으로 부적합한 기능어/접두사 제거 (min_len으로 2자 이하는 자동 제거)
  split_stopwords:
    - than
    - more
    - non
    - anti
    - post
    - neo
    - pre

weights:
  # 티어별 가중치 (3단계 채우기에서 단어 선택 선호도; 클수록 자주 등장)
  core: 100
  marker: 30
  name: 20
  theme: 10                  # LGDE 주제 게이트가 식별한 general 주제어 (담론+미술 실무어)
  general: 1

grid:
  size: 17                   # 실측 후 조정 가능
  # 채우기 타당성 제어: 긴 슬롯이 서로 교차하면 17x17 fully-checked는 거의 채울 수 없음.
  # 긴 답안은 짧은 단어와만 교차하도록(실제 크로스워드 관습) 템플릿을 제한.
  long_threshold: 12         # 이 길이 이상을 '긴 슬롯'으로 간주
  max_long_slots: 4          # 긴 슬롯 최대 개수
  xlong_threshold: 15        # 초장 슬롯 기준
  max_xlong_slots: 2         # 초장 슬롯 최대 개수
  forbid_long_cross: true    # 긴 슬롯끼리 교차 금지
  bank_size: 60              # 생성할 템플릿 뱅크 크기

rules:
  # rule.md 절대 규칙(1~5: fully-checked, 최소 3자, 연결성, 전부검은행 금지, 단어중복 금지)은
  # 항상 강제되며 토글 불가. 아래는 관습 규칙(6~10)을 선택적으로 완화하는 토글이다.
  symmetry: rotational       # ⑥ 180도 회전 대칭. rotational | none (none이면 검은 칸 단독 배치)
  max_black_pct: 0.22        # ⑦ 검은 칸 상한 비율 (관습 16% 완화: 채우기 용이성 위해 상향)
  min_black_pct: 0.16        # ⑦ 검은 칸 하한 (너무 적으면 긴 슬롯 과다 → 채우기 난이도↑)
  allow_cheater_squares: true # ⑦ cheater(단어 수 안 늘리는 검은 칸) 허용
  forbid_2x2_black: true     # ⑧ 2x2 검은 블록 금지 (외형 품질 위해 유지 권장)
  corpus_only: true          # ⑨ 모든 답 코퍼스 실존 (코어는 force_include_core로 예외)
  theme_symmetric: false     # ⑩ 테마 단어 대칭 배치 강제 (완화: 자유 시딩 허용)

theme:
  # 테마 우선 시딩: 채우기 전에 일부 슬롯에 테마(core/marker) 단어를 먼저 배치해
  # 퍼즐당 테마 단어 수를 보장(P7 대응). Majima & Ishihara 2023의 충족+최적화 방향.
  seed_min: 4                # 퍼즐당 최소 시딩 시도 개수
  seed_max: 8                # 퍼즐당 최대 시딩 개수
  seed_tiers:                # 시딩 대상 티어 (우선순위 순)
    - core
    - marker
  prefer_long_slots: true    # 긴 슬롯에 테마 우선 배치 (테마 단어가 길고 눈에 띔)
